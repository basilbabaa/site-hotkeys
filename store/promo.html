<!doctype html>
<!-- Source for the Chrome Web Store promo tiles. Open with #small (440x280) or #marquee (1400x560).
     Render both with store/make-promos.sh. No words on purpose: the store advises against text in promo images. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; }
  body {
    --u: 1px;               /* one design unit; the marquee uses a bigger one */
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 140% at 15% 10%, #1a7fe0 0%, #0a66c2 45%, #084a94 100%);
    font-family: -apple-system, system-ui, sans-serif;
  }
  body.small   { width: 440px;  height: 280px; --u: 1px; }
  body.marquee { width: 1400px; height: 560px; --u: 2.7px; }

  .row { display: flex; align-items: center; gap: calc(14 * var(--u)); }
  .seq { display: flex; align-items: center; gap: calc(10 * var(--u)); }
  .cap {
    min-width: calc(84 * var(--u)); height: calc(84 * var(--u));
    padding: 0 calc(12 * var(--u)); box-sizing: border-box;
    background: #ffffff; color: #0b3f7a; border-radius: calc(18 * var(--u));
    display: flex; align-items: center; justify-content: center;
    font-size: calc(34 * var(--u)); font-weight: 600; letter-spacing: calc(2 * var(--u));
    box-shadow: 0 calc(5 * var(--u)) 0 #b7c9e2, 0 calc(12 * var(--u)) calc(22 * var(--u)) rgba(0, 20, 60, .35);
  }
  .arrow { width: calc(44 * var(--u)); height: calc(44 * var(--u)); }
  .link  { width: calc(96 * var(--u)); height: calc(96 * var(--u)); filter: drop-shadow(0 calc(6 * var(--u)) calc(10 * var(--u)) rgba(0, 20, 60, .35)); }
</style>
</head>
<body>
  <div class="row">
    <div class="seq"><div class="cap">⌃⌥⌘K</div><div class="cap">⇧J</div></div>
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    <svg class="link" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
  </div>
  <script>document.body.className = location.hash.slice(1) || "small";</script>
</body>
</html>
