<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Site Hotkeys: backup</title>
  <style>
    body { font: 14px -apple-system, system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 20px; color: #1d1d1f; }
    h1 { font-size: 20px; }
    p { color: #444; line-height: 1.45; }
    button { padding: 8px 14px; border: 1px solid #c7c7cc; border-radius: 6px; background: #f5f5f7; font: inherit; cursor: pointer; }
    .box { border: 1px solid #e5e5ea; border-radius: 10px; padding: 16px; margin: 18px 0; }
    .box h2 { font-size: 15px; margin: 0 0 6px; }
    #msg { min-height: 20px; font-weight: 600; }
    #msg.err { color: #c62828; } #msg.ok { color: #2e7d32; }
  </style>
</head>
<body>
  <h1>Site Hotkeys: backup and restore</h1>
  <p id="count"></p>

  <div class="box">
    <h2>Export</h2>
    <p>Saves all your hotkeys, for every site, to a file.</p>
    <button id="export">Export to file</button>
  </div>

  <div class="box">
    <h2>Import</h2>
    <p>Adds the hotkeys from an exported file. If a site already has the same key sequence, the file's version wins. Nothing else is deleted.</p>
    <input type="file" id="file" accept="application/json,.json">
  </div>

  <div id="msg"></div>
  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
